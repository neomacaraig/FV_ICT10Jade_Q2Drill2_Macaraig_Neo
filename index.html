<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" /> 
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Math Club Member Manager</title>
    <style>
        body { 
            text-align: center; 
            font-family: sans-serif; 
            background-color: #121212; 
            background-image: url('https://static.vecteezy.com/system/resources/previews/025/361/681/non_2x/math-thin-line-dark-pattern-mathematics-education-seamless-background-vector.jpg');
            background-repeat: repeat;
            background-size: 400px;
            background-blend-mode: overlay;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #fdfbf7; 
            color: #2c2421;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            max-width: 420px;
            width: 100%;
            border: 2px solid #b08968;
        }
        h1 { 
            color: #7f4f24; 
            font-size: 28px;
            margin-bottom: 25px;
        }
        form {
            max-width: 320px;
            margin: 0 auto;
        }
        label {
            display: block;
            text-align: left;
            margin: 0 auto 5px auto;
            width: 250px;
            color: #5c4033;
            font-size: 14px;
            font-weight: bold;
        }
        .form-control { 
            display: block; 
            margin: 0 auto 15px auto; 
            padding: 10px; 
            width: 250px; 
            border-radius: 6px; 
            border: 1px solid #b08968; 
            background: #ffffff; 
            color: #2c2421; 
            font-size: 15px;
            box-sizing: border-box;
        }
        .btn { 
            padding: 10px 24px; 
            background-color: #7f4f24; 
            color: #f5f0eb; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 15px;
            margin-top: 5px;
        }
        .btn:hover {
            background-color: #936639;
        }
        #output1 { 
            margin: 25px auto 0 auto; 
            width: 90%; 
            max-width: 350px; 
            min-height: 120px; 
            border: 3px solid #7f4f24; 
            box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.1); 
            border-radius: 10px; 
            font-size: 15px; 
            padding: 15px; 
            background: #ffffff; 
            color: #5c4033; 
            line-height: 1.4;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>math club</h1>
        <form>
            <label for="fname">First Name</label>
            <input type="text" id="fname" class="form-control" placeholder="First Name" required>

            <label for="lname">Last Name</label>
            <input type="text" id="lname" class="form-control" placeholder="Last Name" required>

            <button type="button" class="btn" py-click="add_member">enter</button>
        </form>
        
        <div id="output1">Enter your name and click enter.</div>
    </div>
    
    <script type="py" src="main.py"></script>
</body>
</html>
